name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: proflow-main
    env:
      # GUI smoke tests run headless, and must run: with this set, a missing
      # PySide6 fails the job instead of skipping tests/test_gui.py.
      QT_QPA_PLATFORM: offscreen
      PROFLOW_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: proflow-main/pyproject.toml

      # Shared libraries the Qt offscreen platform loads on Linux.
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Tool versions are pinned so lint, format and GUI results do not drift
      # between runs; bump them deliberately.
      - name: Install
        run: python -m pip install -e ".[gui]" PySide6==6.12.0 pytest==9.1.1 ruff==0.17.2

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests (including GUI smoke tests)
        run: python -m pytest -q -rs

      - name: Reference fixtures
        run: proflow fixtures
