# Ruff — linter and formatter configuration
# Docs: https://docs.astral.sh/ruff/

line-length = 88
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
]

[lint.per-file-ignores]
# HTML report markup and the Qt stylesheet read better unsplit.
"src/proflow/reports/*.py" = ["E501"]
"src/proflow/gui/style.py" = ["E501"]
